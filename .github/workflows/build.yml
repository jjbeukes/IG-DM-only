name: Build APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # to attach the APK to a GitHub release when a v* tag is pushed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION_CODE: ${{ github.run_number }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          # The MIT-licensed cache, rather than the default provider with its own terms of use.
          cache-provider: basic

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Pick version name
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=1.0.${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Test the page filter script
        working-directory: tools/js-tests
        run: |
          npm ci --no-fund --no-audit
          npm test 2>&1 | tee ../../js-test.log
          exit "${PIPESTATUS[0]}"

      - name: Load signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the release key."
          else
            echo "::warning title=Debug-signed APK::No RELEASE_KEYSTORE_BASE64 secret, so this APK is signed with a throwaway key and cannot update an earlier install in place. See 'Signing' in the README."
          fi

      - name: Unit tests and APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease 2>&1 | tee build.log
          exit "${PIPESTATUS[0]}"

      - name: Explain the failure
        if: failure()
        run: bash .github/scripts/annotate-failure.sh build.log js-test.log

      - name: Name the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/DM-Only-${VERSION_NAME}.apk"
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: DM-Only-${{ env.VERSION_NAME }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.apk
          generate_release_notes: true
